<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Custom banner with reject fixture</title>
    <style>
      .banner {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Custom banner with reject fixture</h1>
      <p>Test page for the Cookie Banner Closer detector.</p>
    </main>
    <div class="banner">
      <p>We use cookies for analytics and ads.</p>
      <button type="button">Accept all</button>
      <button type="button">Reject all</button>
    </div>
  </body>
</html>
