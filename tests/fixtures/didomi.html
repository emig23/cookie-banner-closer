<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Didomi fixture</title>
    <style>
      .banner {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Didomi fixture</h1>
      <p>Test page for the Cookie Banner Closer detector.</p>
    </main>
    <div id="didomi-host">

        <p>We and our partners use cookies.</p>
        <button id="didomi-notice-learn-more-button">Learn more</button>
        <button id="didomi-notice-disagree-button">Disagree and close</button>
        <button id="didomi-notice-agree-button">Agree and close</button>
      </div>
    </div>
  </body>
</html>
